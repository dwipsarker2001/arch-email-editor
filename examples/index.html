<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arch Email Editor</title>
  <link rel="stylesheet" href="../dist/arch-email-editor.css" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
    }
    #editor-container {
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    .arch-editor {
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
    }
  </style>
</head>
<body>
  <div id="editor-container"></div>

  <!-- Include ArchEmailEditor UMD Bundle -->
  <script src="../dist/arch-email-editor.umd.js"></script>
  <script>
    const Editor = window.ArchEmailEditor.create ? window.ArchEmailEditor : window.ArchEmailEditor.ArchEmailEditor;
    const editor = Editor.create('#editor-container', {
      spellcheck: true,
      onChange: (doc) => {
        // Document updated in real-time
      }
    });

    // Expose editor globally on window for easy developer & console access
    window.editor = editor;

    // Helper for headless verification
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab')) {
      setTimeout(() => {
        const tabBtn = document.querySelector(`[data-tab="${params.get('tab')}"]`);
        if (tabBtn) tabBtn.click();
      }, 300);
    } else if (params.get('select')) {
      setTimeout(() => {
        const iframe = document.querySelector('iframe');
        if (iframe && (iframe.contentDocument || iframe.contentWindow.document)) {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const el = doc.querySelector(params.get('select'));
          if (el) {
            el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
          }
        }
      }, 500);
    }
  </script>
</body>
</html>
