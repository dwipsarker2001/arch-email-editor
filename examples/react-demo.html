<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Integration Demo - Arch Email Editor</title>
  <link rel="stylesheet" href="../dist/arch-email-editor.css" />
  <!-- React & ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- ArchEmailEditor UMD bundle -->
  <script src="../dist/arch-email-editor.umd.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .demo-nav a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
    }
    .editor-wrapper {
      background-color: #ffffff;
      border-radius: 8px;
      height: 720px;
    }
    .status-bar {
      margin-top: 16px;
      padding: 12px 16px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>⚛️ React Integration Demo</h1>
      <p>Demonstrates embedding Arch Email Editor inside a React component lifecycle (mount & cleanup).</p>
    </div>
    <div class="demo-nav">
      <a href="index.html">Vanilla Demo 📄</a>
      <a href="vue-demo.html">Vue Demo 🟢</a>
    </div>
  </div>

  <div id="react-root"></div>

  <script>
    const { useState, useEffect, useRef } = React;

    function ReactEmailEditorComponent({ onChange }) {
      const containerRef = useRef(null);
      const editorRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;

        const Editor = window.ArchEmailEditor.create ? window.ArchEmailEditor : window.ArchEmailEditor.ArchEmailEditor;
        editorRef.current = Editor.create(containerRef.current, {
          sidebarPosition: 'left',
          onChange: (doc) => {
            if (onChange) onChange(doc);
          }
        });

        return () => {
          editorRef.current?.destroy();
        };
      }, []);

      return React.createElement('div', {
        ref: containerRef,
        style: { width: '100%', height: '100%' }
      });
    }

    function App() {
      const [blockCount, setBlockCount] = useState(5);

      return React.createElement('div', null,
        React.createElement('div', { className: 'editor-wrapper' },
          React.createElement(ReactEmailEditorComponent, {
            onChange: (doc) => setBlockCount(doc.blocks.length)
          })
        ),
        React.createElement('div', { className: 'status-bar' },
          'React Component State: Total Blocks in Newsletter: ' + blockCount
        )
      );
    }

    ReactDOM.render(React.createElement(App), document.getElementById('react-root'));
  </script>
</body>
</html>
