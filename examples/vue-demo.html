<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vue Integration Demo - Arch Email Editor</title>
  <link rel="stylesheet" href="../dist/arch-email-editor.css" />
  <!-- Vue 3 from CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- ArchEmailEditor UMD bundle -->
  <script src="../dist/arch-email-editor.umd.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .demo-nav a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border: 1px solid #334155;
      border-radius: 6px;
    }
    .editor-wrapper {
      background-color: #ffffff;
      border-radius: 8px;
      height: 720px;
    }
    .status-bar {
      margin-top: 16px;
      padding: 12px 16px;
      background: #1e293b;
      border-radius: 6px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🟢 Vue 3 Integration Demo</h1>
      <p>Demonstrates embedding Arch Email Editor inside a Vue 3 component lifecycle (onMounted & onBeforeUnmount).</p>
    </div>
    <div class="demo-nav">
      <a href="index.html">Vanilla Demo 📄</a>
      <a href="react-demo.html">React Demo ⚛️</a>
    </div>
  </div>

  <div id="vue-root">
    <div class="editor-wrapper">
      <div ref="editorEl" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="status-bar">
      Vue 3 Reactive State: Total Blocks in Newsletter: {{ blockCount }}
    </div>
  </div>

  <script>
    const { createApp, ref, onMounted, onBeforeUnmount } = Vue;

    createApp({
      setup() {
        const editorEl = ref(null);
        const blockCount = ref(5);
        let editorInstance = null;

        onMounted(() => {
          if (!editorEl.value) return;

          const Editor = window.ArchEmailEditor.create ? window.ArchEmailEditor : window.ArchEmailEditor.ArchEmailEditor;
          editorInstance = Editor.create(editorEl.value, {
            sidebarPosition: 'left',
            onChange: (doc) => {
              blockCount.value = doc.blocks.length;
            }
          });
        });

        onBeforeUnmount(() => {
          editorInstance?.destroy();
        });

        return {
          editorEl,
          blockCount
        };
      }
    }).mount('#vue-root');
  </script>
</body>
</html>
